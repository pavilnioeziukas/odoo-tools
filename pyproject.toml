[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "odoo-tools"
version = "0.1.0"
description = "Reusable read-only Odoo reporting tools"
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1.5",
    "python-dotenv>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["odoo_tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
